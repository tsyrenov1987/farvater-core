name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: license gate (no GPL/AGPL modules)
        run: ./tools/licensegate.sh
