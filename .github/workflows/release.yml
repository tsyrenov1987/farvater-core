name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: ./tools/licensegate.sh
      - name: build
        env:
          VER: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=; [ "$os" = windows ] && ext=.exe
            for c in kilvaterd farvater; do
              d=$(mktemp -d)
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VER" -o "$d/$c$ext" ./cmd/$c
              cp LICENSE NOTICE "$d/"
              [ $c = kilvaterd ] && cp deploy/kilvaterd.service docs/KILVATERD.md "$d/"
              name=${c}_${VER}_${os}_${arch}
              if [ "$os" = windows ]; then (cd "$d" && zip -q -r "$OLDPWD/dist/$name.zip" .); else tar -C "$d" -czf "dist/$name.tar.gz" .; fi
            done
          done
          cd dist && sha256sum * > SHA256SUMS
      - name: no known vulnerabilities in the server binary
        run: |
          set -eu
          want=$(go mod edit -json | jq -r .Toolchain)
          got=$(go version | awk '{print $3}')
          [ "$got" = "$want" ] || { echo "built with $got, go.mod wants $want"; exit 1; }
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/kilvaterd" ./cmd/kilvaterd
          go run golang.org/x/vuln/cmd/govulncheck@latest -mode binary "$RUNNER_TEMP/kilvaterd"
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: 'dist/*'
      - name: provenance as a release asset
        run: cp "${{ steps.attest.outputs.bundle-path }}" dist/provenance.intoto.jsonl
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ github.ref_name }}
        run: gh release create "$VER" dist/* --title "$VER" --notes-file .github/release-notes.md --verify-tag
